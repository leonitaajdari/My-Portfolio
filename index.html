<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leonita Ajdari | Front-End Developer Portfolio</title>
    <meta
      name="description"
      content="Portfolio of Leonita Ajdari, an Applied Programming student and aspiring Front-End Developer building modern websites with HTML, CSS, JavaScript and React."
    />
    <meta name="theme-color" content="#0f1015" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Sets the theme before first paint: saved choice, else the system preference. -->
    <script>
      (function () {
        var theme = "dark";
        try {
          var saved = localStorage.getItem("theme");
          if (saved === "light" || saved === "dark") theme = saved;
          else if (window.matchMedia("(prefers-color-scheme: light)").matches) theme = "light";
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme === "light" ? "#f7f7fa" : "#0f1015");
      })();
    </script>

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Leonita Ajdari | Front-End Developer Portfolio" />
    <meta
      property="og:description"
      content="Applied Programming student and aspiring Front-End Developer. Explore my projects built with HTML, CSS, JavaScript and React."
    />
    <meta property="og:image" content="/images/fitplan.webp" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  </body>
</html>
